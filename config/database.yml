default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  host: <%= ENV["POSTGRES_HOST"] %>
  username: <%= ENV["POSTGRES_USER"] || Rails.application.credentials.dig(:database, :username) %>
  password: <%= ENV["POSTGRES_PASSWORD"] || Rails.application.credentials.dig(:database, :password) %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "soulbuilding_development") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: soulbuilding_test

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "soulbuilding_production") %>